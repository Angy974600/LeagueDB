<!DOCTYPE html>
<html lang="it" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeagueDB — Statistiche giocatori League of Legends</title>
  <meta name="description"
    content="Dashboard minimal per statistiche dei giocatori di League of Legends: rank, campioni, ruoli e cronologia partite da un data warehouse PostgreSQL.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c6cf6'/%3E%3Cpath d='M16 7l8 9-8 9-8-9z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ddragon.leagueoflegends.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/mastery.css">
  <script>
    // Applica il tema prima del render per evitare flash
    (function () {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>

<body>
  <header class="topbar">
    <a href="#/" class="brand" id="brand-link" aria-label="LeagueDB home">
      <span class="brand-mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2l9 10-9 10-9-10z" />
        </svg>
      </span>
      <span class="brand-text">LeagueDB</span>
    </a>

    <form class="search" id="search-form" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input id="search-input" type="search" placeholder="Cerca giocatore, es. Anfrost#EUW" autocomplete="off"
        aria-label="Cerca giocatore">
    </form>

    <div style="display:flex; align-items:center; gap:8px;">


      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambia tema">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <div id="toast" class="toast" role="status"></div>

  <script src="/static/js/app.js" type="module"></script>
</body>

</html>
